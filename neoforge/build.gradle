plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
    id 'idea'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Mojang 在 26.1.2 向玩家分发 Java 25
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

// core 的类与本模组同属一个 mod：开发运行时并入同一个模组，发布时打进同一个 jar
evaluationDependsOn(':core')
def coreMain = project(':core').sourceSets.main

// 开发专用源集（自动截图验收模式）：只并入开发运行的模组，不会打进发布的 jar
sourceSets {
    dev
}

dependencies {
    implementation coreMain.output
    devImplementation sourceSets.main.output
    devImplementation coreMain.output
}

// 开发环境调试日志目录：仓库根目录的 logs/
def devLogDir = rootProject.file('logs').absolutePath

neoForge {
    version = project.neo_version
    addModdingDependenciesTo(sourceSets.dev)

    runs {
        client {
            client()
            gameDirectory = project.file('runs/client')
        }

        server {
            server()
            gameDirectory = project.file('runs/server')
            programArgument '--nogui'
        }

        // 启动 GameTestServer，跑完本模组的全部 GameTest 后退出
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('runs/gametest')
        }

        // 自动截图验收模式：./gradlew :neoforge:runScreenshots
        screenshots {
            client()
            gameDirectory = project.file('runs/screenshots')
            systemProperty 'creepercapital.screenshot.dir', rootProject.file('screenshots').absolutePath
            programArguments.addAll '--width', '1280', '--height', '720'
        }

        configureEach {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            systemProperty 'creepercapital.devLogDir', devLogDir
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet coreMain
            sourceSet sourceSets.dev
        }
    }
}

// 截图运行前重置环境：删掉上次的测试世界，写入无人值守所需的客户端选项
def screenshotRunDir = layout.projectDirectory.dir('runs/screenshots')
def prepareScreenshotRun = tasks.register('prepareScreenshotRun') {
    doLast {
        def dir = screenshotRunDir.asFile
        new File(dir, 'saves').deleteDir()
        dir.mkdirs()
        new File(dir, 'options.txt').setText([
                'lang:zh_cn', 'guiScale:2', 'pauseOnLostFocus:false', 'onboardAccessibility:false',
                'tutorialStep:none', 'fullscreen:false', 'narrator:0'
        ].join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
    }
}
tasks.matching { it.name == 'runScreenshots' }.configureEach { dependsOn prepareScreenshotRun }

// 专用服务端的控制台转发 Gradle 的标准输入：可以直接输入 stop、creeper dev ... 等命令，端到端重启测试也靠它驱动
tasks.matching { it.name == 'runServer' }.configureEach { standardInput = System.in }

// 一条命令跑完 core 单元测试与 GameTest：./gradlew check
tasks.named('check') {
    dependsOn 'runGameTestServer'
}

tasks.named('jar', Jar) {
    from coreMain.output
}

var generateModMetadata = tasks.register('generateModMetadata', ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from 'src/main/templates'
    into 'build/generated/sources/modMetadata'
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 守护进程使用本机编码（见 gradle.properties），资源文件统一按 UTF-8 处理
tasks.withType(ProcessResources).configureEach {
    filteringCharset = 'UTF-8'
}
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
